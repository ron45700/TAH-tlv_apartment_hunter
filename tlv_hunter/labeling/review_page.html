<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review classifications</title>
<!-- The review report (PHASE_2.md 2.7). Static: no server, no network, no external script or
     font. Generated by `python -m tlv_hunter.jobs.review_page`; do not edit the generated file. -->
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
  --accent: #1f5fae; --accent-ink: #ffffff; --ok: #2e7d32; --warn: #a15c00; --bad: #b3261e;
  --chip: #e8eef7; --wrong: #fdecea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #20201f; --ink: #ecece8; --muted: #a3a39c; --line: #3a3a37;
    --accent: #6ea4e8; --accent-ink: #0d1a2b; --ok: #7cc47f; --warn: #e3a54f; --bad: #f28b82;
    --chip: #283547; --wrong: #3a2321;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
header h1 { font-size: 16px; margin: 0; }
#progress { color: var(--muted); }
.spacer { flex: 1; }
button, select, input, textarea { font: inherit; color: inherit; }
button, select, input[type=text], input[type=number], input[type=date], textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#storage-warning { display: none; background: var(--warn); color: #fff; padding: 8px 16px; }
#summary { padding: 12px 16px 0; max-width: 1500px; margin: 0 auto; }
#summary table { border-collapse: collapse; }
#summary td, #summary th { border: 1px solid var(--line); padding: 2px 8px; text-align: left; }
#cards { padding: 12px 16px; max-width: 1500px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 14px; }
.card-head { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px;
  margin-bottom: 8px; }
.card-head b { color: var(--ink); }
.card-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 14px; }
@media (max-width: 1000px) { .card-body { grid-template-columns: minmax(0, 1fr); } }
.text { white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; font-size: 15px;
  line-height: 1.55; max-height: 520px; overflow-y: auto; }
.names { margin-top: 8px; font-size: 13px; }
.names .dropped { color: var(--bad); }
.he { unicode-bidi: plaintext; }
table.fields { border-collapse: collapse; width: 100%; }
table.fields td { border-top: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
table.fields td.name { color: var(--muted); white-space: nowrap; width: 1%; }
table.fields tr.wrong { background: var(--wrong); }
table.fields td.value { unicode-bidi: plaintext; }
.unclear { color: var(--warn); font-weight: 600; }
.editor { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; }
.editor textarea { min-width: 220px; min-height: 48px; }
.invalid { color: var(--bad); font-size: 12px; }
.card-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 10px; }
.card-foot textarea { flex: 1; min-width: 240px; min-height: 34px; }
.status-reviewed { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Review classifications</h1>
  <span id="progress"></span>
  <span class="spacer"></span>
  <label>Show
    <select id="filter-state">
      <option value="all">all posts</option>
      <option value="active">active</option>
      <option value="rejected">rejected</option>
    </select>
  </label>
  <label><input type="checkbox" id="filter-unclear"> any field unclear</label>
  <label><input type="checkbox" id="filter-dropped"> a name dropped</label>
  <label><input type="checkbox" id="filter-set"> in the regression set</label>
  <label><input type="checkbox" id="filter-open"> not reviewed yet</label>
  <button id="export" type="button" class="primary">Export corrections.json</button>
</header>
<div id="storage-warning">This browser does not keep the page's progress. Export before closing the page.</div>
<section id="summary"></section>
<section id="cards"></section>

<script type="application/json" id="page-data">__PAGE_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("page-data").textContent);
const STORAGE_KEY = "tlv-hunter-review-v" + DATA.format_version;
const AREA_NAME = new Map(DATA.areas.map(a => [a.number, a.name]));
const STATES = ["written", "not_written", "unclear"];
// Each correctable field's control: its kind, and its closed values where it has them.
const KINDS = {
  post_nature: ["enum", ["rental_offer", "sublet_offer", "seeking", "for_sale", "not_listing"]],
  apartment_kind: ["marked_enum", ["room", "whole_apartment"]],
  price: ["marked_ints"],
  entry_date_written: ["text_or_null"],
  entry_date: ["marked_entry"],
  rooms: ["marked_number"], size_sqm: ["marked_number"], room_size_sqm: ["marked_number"],
  floor: ["marked_int"], building_floors: ["marked_int"],
  broker: ["marked_bool"], balcony: ["marked_bool"], parking: ["marked_bool"],
  elevator: ["marked_bool"], air_conditioning: ["marked_bool"],
  furnished: ["marked_enum", ["yes", "partial", "no"]],
  arnona: ["marked_amount"], house_committee: ["marked_amount"],
  gender: ["enum", ["no_restriction", "women_preferred", "women_only"]],
  streets: ["str_list"], stated_area_names: ["str_list"],
  areas: ["areas"],
  other_city: ["text_or_null"],
  phone_names: ["phone_names"],
};

let store = {};
let storageWorks = true;
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; }
catch (e) { storageWorks = false; }
if (!storageWorks) document.getElementById("storage-warning").style.display = "block";
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  catch (e) { document.getElementById("storage-warning").style.display = "block"; }
}
// Progress is kept per classification, so a new classification of a post starts afresh.
function keyOf(card) { return card.listing_id + "|" + card.listing.classified_at; }
function stateOf(card) {
  const s = store[keyOf(card)] || {};
  return { reviewed: !!s.reviewed, note: s.note || "", wrong: s.wrong || {}, inputs: s.inputs || {} };
}
function put(card, s) {
  const empty = !s.reviewed && !s.note && !Object.keys(s.wrong).some(k => s.wrong[k]);
  if (empty) delete store[keyOf(card)]; else store[keyOf(card)] = s;
  save();
}

// --- showing values ---
function shown(value) {
  if (value === null || value === undefined) return "null";
  if (Array.isArray(value)) return "[" + value.map(shown).join(", ") + "]";
  if (typeof value === "object" && "state" in value) {
    return value.state === "written" ? shown(value.value) : value.state;
  }
  if (typeof value === "object" && "phone" in value) return value.phone + " " + value.name;
  return String(value);
}
function shownField(name, value) {
  if (name === "areas") return value.length ? value.map(n => `${n} ${AREA_NAME.get(n)}`).join(", ") : "[]";
  return shown(value);
}

// --- the editors: UI input to the right value, in Listing's shape (corrections.py) ---
function initialInput(name, value) {
  const kind = KINDS[name][0];
  if (kind === "enum") return { v: value };
  if (kind === "text_or_null") return { none: value === null, text: value || "" };
  if (kind === "str_list") return { text: value.join("\n") };
  if (kind === "areas") return { text: value.join(" ") };
  if (kind === "phone_names") return { text: value.map(p => p.phone + " | " + p.name).join("\n") };
  const v = value.value;
  if (kind === "marked_ints") return { state: value.state, text: v ? v.join(" ") : "" };
  if (kind === "marked_bool") return { state: value.state, v: v === null ? "true" : String(v) };
  if (kind === "marked_amount") {
    return { state: value.state, mode: v === "included" ? "included" : "amount",
      text: v === null || v === "included" ? "" : String(v) };
  }
  if (kind === "marked_entry") {
    return { state: value.state, mode: v === "immediate" ? "immediate" : "date",
      date: v && v !== "immediate" ? v : "" };
  }
  if (kind === "marked_enum") return { state: value.state, v: v === null ? KINDS[name][1][0] : v };
  return { state: value.state, text: v === null ? "" : String(v) };
}
function wholeNumbers(text) {
  const parts = text.trim().split(/\s+/).filter(Boolean);
  if (!parts.length || parts.some(p => !/^\d+$/.test(p))) return null;
  return parts.map(Number);
}
// Returns [value] or [undefined, "why"].
function rightValue(name, input) {
  const kind = KINDS[name][0];
  if (kind === "enum") return [input.v];
  if (kind === "text_or_null") {
    if (input.none) return [null];
    return input.text.trim() ? [input.text.trim()] : [undefined, "empty: tick none instead"];
  }
  if (kind === "str_list") return [input.text.split("\n").map(s => s.trim()).filter(Boolean)];
  if (kind === "areas") {
    if (!input.text.trim()) return [[]];
    const numbers = wholeNumbers(input.text);
    if (!numbers || numbers.some(n => n < 1 || n > 71)) return [undefined, "numbers 1-71"];
    return [[...new Set(numbers)].sort((a, b) => a - b)];
  }
  if (kind === "phone_names") {
    const pairs = [];
    for (const line of input.text.split("\n").map(s => s.trim()).filter(Boolean)) {
      const cut = line.indexOf("|");
      if (cut < 0) return [undefined, "phone | name, one per line"];
      pairs.push({ phone: line.slice(0, cut).trim(), name: line.slice(cut + 1).trim() });
    }
    return [pairs];
  }
  if (input.state !== "written") return [{ state: input.state, value: null }];
  let value;
  if (kind === "marked_enum") value = input.v;
  else if (kind === "marked_bool") value = input.v === "true";
  else if (kind === "marked_ints") {
    value = wholeNumbers(input.text);
    if (!value || value.some(n => n <= 0)) return [undefined, "whole amounts above 0, by spaces"];
  } else if (kind === "marked_amount") {
    if (input.mode === "included") value = "included";
    else {
      const numbers = wholeNumbers(input.text);
      if (!numbers || numbers.length !== 1) return [undefined, "one whole amount"];
      value = numbers[0];
    }
  } else if (kind === "marked_entry") {
    if (input.mode === "immediate") value = "immediate";
    else if (/^\d{4}-\d{2}-\d{2}$/.test(input.date)) value = input.date;
    else return [undefined, "a date"];
  } else if (kind === "marked_int") {
    if (!/^-?\d+$/.test(input.text.trim())) return [undefined, "a whole number"];
    value = Number(input.text.trim());
  } else {
    const n = Number(input.text.trim());
    if (!input.text.trim() || !Number.isFinite(n)) return [undefined, "a number"];
    value = n;
  }
  return [{ state: "written", value: value }];
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (k === "text") node.textContent = v; else if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  });
  (children || []).forEach(c => node.appendChild(c));
  return node;
}
function select(options, value, onChange) {
  const node = el("select");
  options.forEach(o => node.appendChild(el("option", { value: o, text: o })));
  node.value = value;
  node.addEventListener("change", () => onChange(node.value));
  return node;
}
function textInput(value, onInput, attrs) {
  const node = el("input", Object.assign({ type: "text" }, attrs || {}));
  node.value = value;
  node.addEventListener("input", () => onInput(node.value));
  return node;
}
function area(value, onInput) {
  const node = el("textarea", { dir: "auto" });
  node.value = value;
  node.addEventListener("input", () => onInput(node.value));
  return node;
}

function editor(card, name, s, refresh) {
  const input = s.inputs[name];
  const set = (k, v, full) => { input[k] = v; put(card, s); refresh(full); };
  const kind = KINDS[name][0];
  const box = el("div", { class: "editor" });
  if (kind === "enum") box.appendChild(select(KINDS[name][1], input.v, v => set("v", v)));
  else if (kind === "text_or_null") {
    const none = el("input", { type: "checkbox" });
    none.checked = input.none;
    none.addEventListener("change", () => set("none", none.checked, true));
    box.append(el("label", {}, [none, document.createTextNode(" none")]));
    if (!input.none) box.appendChild(textInput(input.text, v => set("text", v), { dir: "auto" }));
  } else if (["str_list", "areas", "phone_names"].includes(kind)) {
    const hint = { str_list: "one per line, as written", areas: "numbers 1-71, by spaces",
      phone_names: "phone | name, one per line" }[kind];
    box.append(area(input.text, v => set("text", v)), el("span", { class: "invalid", text: hint }));
  } else {
    box.appendChild(select(STATES, input.state, v => set("state", v, true)));
    if (input.state === "written") {
      if (kind === "marked_enum") box.appendChild(select(KINDS[name][1], input.v, v => set("v", v)));
      else if (kind === "marked_bool") box.appendChild(select(["true", "false"], input.v, v => set("v", v)));
      else if (kind === "marked_amount") {
        box.appendChild(select(["amount", "included"], input.mode, v => set("mode", v, true)));
        if (input.mode === "amount") box.appendChild(textInput(input.text, v => set("text", v)));
      } else if (kind === "marked_entry") {
        box.appendChild(select(["immediate", "date"], input.mode, v => set("mode", v, true)));
        if (input.mode === "date") {
          const d = el("input", { type: "date" });
          d.value = input.date;
          d.addEventListener("input", () => set("date", d.value));
          box.appendChild(d);
        }
      } else box.appendChild(textInput(input.text, v => set("text", v)));
    }
  }
  const [, why] = rightValue(name, input);
  if (why) box.appendChild(el("span", { class: "invalid", text: "invalid: " + why }));
  return box;
}

function hasUnclear(listing) {
  return Object.values(listing).some(v => v && typeof v === "object" && v.state === "unclear");
}
function hasDropped(card) {
  return card.dropped_streets.length || card.dropped_area_names.length || card.dropped_other_city;
}

function renderCard(card) {
  const node = el("article", { class: "card", id: "card-" + card.listing_id });
  const draw = () => {
    const s = stateOf(card);
    node.textContent = "";
    const listing = card.listing;
    const head = el("div", { class: "card-head" }, [
      el("b", { text: card.listing_id.slice(0, 12) }),
      el("span", { text: card.position ? `set position ${card.position}` : "not in the set" }),
      el("span", { text: "rejection: " + (card.rejection_reason || "none (active)") }),
      el("span", { text: `prompt ${listing.prompt_version} · ${listing.model_name} · ${listing.classified_at}` }),
    ]);
    const left = el("div");
    left.appendChild(el("div", { class: "text", dir: "auto", text: card.text }));
    const names = el("div", { class: "names" });
    const line = (label, items, cls) => names.appendChild(el("div", {}, [
      el("span", { text: label + ": " }),
      el("span", { class: "he " + (cls || ""), text: items.length ? items.join(" · ") : "none" }),
    ]));
    line("Streets as written", listing.streets);
    line("Area names as written", listing.stated_area_names);
    line("Dropped streets", card.dropped_streets, "dropped");
    line("Dropped area names", card.dropped_area_names, "dropped");
    line("Dropped other city", card.dropped_other_city ? [card.dropped_other_city] : [], "dropped");
    left.appendChild(names);

    const table = el("table", { class: "fields" });
    DATA.fields.forEach(name => {
      const value = listing[name];
      const wrong = !!s.wrong[name];
      const row = el("tr", { class: wrong ? "wrong" : "" });
      const shownValue = el("td", { class: "value" + (value && value.state === "unclear" ? " unclear" : ""),
        text: shownField(name, value) });
      const box = el("input", { type: "checkbox", title: "Wrong" });
      box.checked = wrong;
      box.addEventListener("change", () => {
        s.wrong[name] = box.checked;
        if (box.checked && !s.inputs[name]) s.inputs[name] = initialInput(name, value);
        put(card, s); draw(); renderProgress();
      });
      const cell = el("td", {}, [el("label", {}, [box, document.createTextNode(" wrong")])]);
      if (wrong) cell.appendChild(editor(card, name, s, full => { if (full) draw(); }));
      row.append(el("td", { class: "name", text: name }), shownValue, cell);
      table.appendChild(row);
    });

    const reviewed = el("input", { type: "checkbox" });
    reviewed.checked = s.reviewed;
    reviewed.addEventListener("change", () => { s.reviewed = reviewed.checked; put(card, s); draw(); renderProgress(); applyFilters(); });
    const note = el("textarea", { dir: "auto", placeholder: "Note" });
    note.value = s.note;
    note.addEventListener("input", () => { s.note = note.value; put(card, s); });
    const foot = el("div", { class: "card-foot" }, [
      el("label", { class: s.reviewed ? "status-reviewed" : "" }, [reviewed, document.createTextNode(" Reviewed")]),
      note,
    ]);
    node.append(head, el("div", { class: "card-body" }, [left, table]), foot);
  };
  draw();
  return node;
}

function applyFilters() {
  const state = document.getElementById("filter-state").value;
  const unclear = document.getElementById("filter-unclear").checked;
  const dropped = document.getElementById("filter-dropped").checked;
  const inSet = document.getElementById("filter-set").checked;
  const open = document.getElementById("filter-open").checked;
  DATA.cards.forEach(card => {
    let show = true;
    if (state === "active" && card.rejection_reason) show = false;
    if (state === "rejected" && !card.rejection_reason) show = false;
    if (unclear && !hasUnclear(card.listing)) show = false;
    if (dropped && !hasDropped(card)) show = false;
    if (inSet && !card.position) show = false;
    if (open && stateOf(card).reviewed) show = false;
    document.getElementById("card-" + card.listing_id).style.display = show ? "" : "none";
  });
}
function renderProgress() {
  const reviewed = DATA.cards.filter(c => stateOf(c).reviewed).length;
  const corrected = DATA.cards.filter(c => Object.values(stateOf(c).wrong).some(Boolean)).length;
  document.getElementById("progress").textContent =
    `${reviewed} of ${DATA.cards.length} reviewed, ${corrected} with a field marked wrong`;
}
function renderSummary() {
  const box = document.getElementById("summary");
  box.appendChild(el("p", { text: `Source: ${DATA.source}. Generated ${DATA.generated_at}.` }));
  if (DATA.errors === null) {
    box.appendChild(el("p", { text: "No corrections.json yet: no errors counted." }));
    return;
  }
  box.appendChild(el("p", { text: `Errors per field, from corrections.json (${DATA.reviewed} posts reviewed):` }));
  const table = el("table");
  Object.entries(DATA.errors).forEach(([name, count]) => {
    table.appendChild(el("tr", {}, [el("td", { text: name }), el("td", { text: String(count) })]));
  });
  box.appendChild(table);
}

document.getElementById("export").addEventListener("click", () => {
  const corrections = {};
  const invalid = [];
  DATA.cards.forEach(card => {
    const s = stateOf(card);
    const fields = {};
    Object.keys(s.wrong).filter(n => s.wrong[n]).forEach(name => {
      const [value, why] = rightValue(name, s.inputs[name]);
      if (why) invalid.push(`${card.listing_id.slice(0, 12)} ${name}`); else fields[name] = value;
    });
    if (!s.reviewed && !s.note && !Object.keys(fields).length) return;
    corrections[card.listing_id] = {
      text_sha256: card.text_sha256,
      prompt_version: card.listing.prompt_version,
      model_name: card.listing.model_name,
      classified_at: card.listing.classified_at,
      reviewed: s.reviewed,
      fields: fields,
      note: s.note,
    };
  });
  if (invalid.length && !confirm(`Not exported, invalid: ${invalid.join(", ")}. Export the rest?`)) return;
  const file = { format_version: DATA.format_version, exported_at: new Date().toISOString(), corrections: corrections };
  const blob = new Blob([JSON.stringify(file, null, 1) + "\n"], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "corrections.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
});
["filter-state", "filter-unclear", "filter-dropped", "filter-set", "filter-open"].forEach(id => {
  document.getElementById(id).addEventListener("change", applyFilters);
});

renderSummary();
const cardsBox = document.getElementById("cards");
DATA.cards.forEach(card => cardsBox.appendChild(renderCard(card)));
if (!DATA.cards.length) cardsBox.appendChild(el("p", { text: "No classified post to review." }));
renderProgress();
applyFilters();
</script>
</body>
</html>
