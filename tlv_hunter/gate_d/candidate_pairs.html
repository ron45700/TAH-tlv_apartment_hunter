<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate pairs</title>
<!-- Gate D's evidence (PHASE_2.md 2.10). Static: no server, no network, no external script or
     font. Generated by `python -m tlv_hunter.jobs.gate_d_pairs`; do not edit the generated file. -->
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
  --accent: #1f5fae; --accent-ink: #ffffff; --ok: #2e7d32; --warn: #a15c00; --bad: #b3261e;
  --chip: #e8eef7; --match: #e3f3e4; --sample: #fff4dd;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #20201f; --ink: #ecece8; --muted: #a3a39c; --line: #3a3a37;
    --accent: #6ea4e8; --accent-ink: #0d1a2b; --ok: #7cc47f; --warn: #e3a54f; --bad: #f28b82;
    --chip: #283547; --match: #213a24; --sample: #3b3220;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
header h1 { font-size: 16px; margin: 0; }
#progress { color: var(--muted); }
.spacer { flex: 1; }
button, select, input, textarea { font: inherit; color: inherit; }
button, select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#storage-warning { display: none; background: var(--warn); color: #fff; padding: 8px 16px; }
#summary { padding: 12px 16px 0; max-width: 1500px; margin: 0 auto; color: var(--muted); }
#summary p { margin: 2px 0; }
#cards { padding: 12px 16px; max-width: 1500px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px 14px; margin-bottom: 16px; }
.card.sample { border-color: var(--warn); }
.card-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 8px; }
.chip { background: var(--chip); border-radius: 10px; padding: 1px 9px; font-size: 12px; }
.chip.match { background: var(--match); }
.chip.sample { background: var(--sample); color: var(--warn); font-weight: 600; }
.sides { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 1000px) { .sides { grid-template-columns: minmax(0, 1fr); } }
.side { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.meta b { color: var(--ink); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; font-size: 15px;
  line-height: 1.55; max-height: 420px; overflow-y: auto; }
table.fields { border-collapse: collapse; margin-top: 8px; width: 100%; }
table.fields td { border-top: 1px solid var(--line); padding: 2px 6px; vertical-align: top; }
table.fields td.name { color: var(--muted); white-space: nowrap; width: 1%; }
table.fields tr.match { background: var(--match); }
.photos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.photos img { height: 110px; width: auto; max-width: 160px; object-fit: cover; border-radius: 4px;
  border: 1px solid var(--line); }
.verdict { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
.verdict label { cursor: pointer; }
.verdict textarea { flex: 1; min-width: 240px; min-height: 34px; }
.judged { color: var(--ok); font-weight: 600; }
a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Candidate pairs</h1>
  <span id="progress"></span>
  <span class="spacer"></span>
  <label>Show
    <select id="filter-signal">
      <option value="all">every pair</option>
      <option value="fields">found by the fields rule</option>
      <option value="phone">found by the phone rule</option>
      <option value="agent_phone_sample">the agent-number sample</option>
    </select>
  </label>
  <label><input type="checkbox" id="filter-open"> not judged yet</label>
  <button id="export" type="button" class="primary">Export pair_verdicts.json</button>
</header>
<div id="storage-warning">This browser does not keep the page's progress. Export before closing the page.</div>
<section id="summary"></section>
<section id="cards"></section>

<script type="application/json" id="page-data">__PAGE_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("page-data").textContent);
const STORAGE_KEY = "tlv-hunter-gate-d-v" + DATA.format_version + "-r" + DATA.rules_version;
const AREA_NAME = new Map(DATA.areas.map(a => [a.number, a.name]));
const VERDICT_LABEL = {
  same_listing: "Same listing: the same offer posted again with other text",
  same_apartment_other_listing: "Same apartment, another listing (for example two rooms of one flat)",
  different: "Different",
  not_sure: "Not sure",
};
const SIGNAL_LABEL = {
  fields: "price, rooms and area match",
  phone: "shared phone number",
  agent_phone_sample: "SAMPLE: an agent's number, one number for many apartments",
};
const MATCH_LABEL = { price: "price", rooms: "rooms", areas: "area" };
const ISRAEL = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Asia/Jerusalem", weekday: "short", day: "numeric", month: "short",
  hour: "2-digit", minute: "2-digit",
});

let store = {};
let storageWorks = true;
try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; }
catch (e) { storageWorks = false; }
if (!storageWorks) document.getElementById("storage-warning").style.display = "block";
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  catch (e) { document.getElementById("storage-warning").style.display = "block"; }
}
// Progress is kept per pair and per pair of texts, so a post whose text changed starts afresh.
function keyOf(pair) { return pair.key + "|" + pair.posts[0].text_sha256 + "|" + pair.posts[1].text_sha256; }
function stateOf(pair) {
  const s = store[keyOf(pair)] || {};
  return { verdict: s.verdict || "", note: s.note || "" };
}
function put(pair, s) {
  if (!s.verdict && !s.note) delete store[keyOf(pair)]; else store[keyOf(pair)] = s;
  save();
}

// Every value below reaches the page through textContent, never as markup.
function el(tag, props, children) {
  const node = document.createElement(tag);
  Object.entries(props || {}).forEach(([k, v]) => {
    if (k === "text") node.textContent = v;
    else if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  });
  (children || []).forEach(c => node.appendChild(c));
  return node;
}
function shownMarked(m) {
  if (m.state === "written") return Array.isArray(m.value) ? m.value.join(", ") : String(m.value);
  return m.state === "unclear" ? "unclear" : "not written";
}
function israelTime(iso) { return ISRAEL.format(new Date(iso)); }

function renderSide(pair, post) {
  const meta = el("div", { class: "meta" });
  meta.appendChild(el("b", { text: israelTime(post.posted_at) + " (Israel time)" }));
  meta.appendChild(document.createTextNode(" · " + (post.group_title || post.group_id)));
  meta.appendChild(document.createTextNode(" · author: " + (post.author_name || "unknown") + " · "));
  if (/^https?:\/\//.test(post.permalink)) {
    meta.appendChild(el("a", { href: post.permalink, target: "_blank", rel: "noreferrer noopener", text: "open the post" }));
  }
  meta.appendChild(document.createTextNode(" · " + post.listing_id.slice(0, 8)));
  const side = el("div", { class: "side" }, [meta, el("div", { class: "text", text: post.text })]);

  const l = post.listing;
  const rows = [
    ["price", "price", shownMarked(l.price) + (l.price_source ? " (" + l.price_source + ")" : "")],
    ["rooms", "rooms", shownMarked(l.rooms)],
    ["areas", "area", l.areas.length ? l.areas.map(n => n + " " + (AREA_NAME.get(n) || "")).join("; ") : "none"],
    [null, "kind", shownMarked(l.apartment_kind)],
    [null, "nature", l.post_nature],
  ];
  const table = el("table", { class: "fields" });
  rows.forEach(([field, name, value]) => {
    const tr = el("tr", { class: field && pair.matched.includes(field) ? "match" : "" }, [
      el("td", { class: "name", text: name }), el("td", { text: value }),
    ]);
    table.appendChild(tr);
  });
  side.appendChild(table);

  if (post.photos.length) {
    const box = el("div", { class: "photos" });
    post.photos.forEach(path => {
      box.appendChild(el("img", { src: DATA.images_base + "/" + encodeURI(path), alt: "", loading: "lazy" }));
    });
    side.appendChild(box);
  }
  return side;
}

function renderCard(pair, index) {
  const sample = pair.found_by.includes("agent_phone_sample");
  const head = el("div", { class: "card-head" }, [el("b", { text: "Pair " + (index + 1) })]);
  pair.found_by.forEach(s => head.appendChild(el("span", { class: "chip" + (s === "agent_phone_sample" ? " sample" : ""), text: SIGNAL_LABEL[s] })));
  pair.matched.forEach(m => head.appendChild(el("span", { class: "chip match", text: MATCH_LABEL[m] + " matches" })));
  if (pair.shared_phones.length) head.appendChild(el("span", { class: "chip", text: "shared: " + pair.shared_phones.join(", ") }));
  head.appendChild(el("span", { class: "chip", text: pair.gap_hours.toFixed(1) + " h apart" }));
  head.appendChild(el("span", { class: "chip", text: pair.same_group ? "same group" : "different groups" }));
  const status = el("span", { class: "judged" });
  head.appendChild(status);

  const card = el("div", { class: "card" + (sample ? " sample" : ""), "data-key": keyOf(pair) }, [
    head,
    el("div", { class: "sides" }, [renderSide(pair, pair.posts[0]), renderSide(pair, pair.posts[1])]),
  ]);

  const s = stateOf(pair);
  const verdict = el("div", { class: "verdict" });
  DATA.verdicts.forEach(v => {
    const input = el("input", { type: "radio", name: "verdict-" + index, value: v });
    input.checked = s.verdict === v;
    input.addEventListener("change", () => { s.verdict = v; put(pair, s); refresh(); });
    verdict.appendChild(el("label", {}, [input, document.createTextNode(" " + VERDICT_LABEL[v])]));
  });
  const note = el("textarea", { placeholder: "note (optional)" });
  note.value = s.note;
  note.addEventListener("input", () => { s.note = note.value; put(pair, s); });
  verdict.appendChild(note);
  card.appendChild(verdict);

  card._pair = pair;
  card._status = status;
  card._state = s;
  return card;
}

const cardsBox = document.getElementById("cards");
function refresh() {
  const signal = document.getElementById("filter-signal").value;
  const openOnly = document.getElementById("filter-open").checked;
  let judged = 0;
  Array.from(cardsBox.children).forEach(card => {
    if (!card._pair) return;
    const done = !!card._state.verdict;
    if (done) judged++;
    card._status.textContent = done ? "judged" : "";
    const show = (signal === "all" || card._pair.found_by.includes(signal)) && !(openOnly && done);
    card.style.display = show ? "" : "none";
  });
  document.getElementById("progress").textContent = judged + " of " + DATA.pairs.length + " pairs judged";
}

function renderSummary() {
  const s = DATA.summary, box = document.getElementById("summary");
  const lines = [
    s.members + " active canonical posts compared; their posts span " + s.span_hours + " hours; a pair needs two posts within " + s.window_hours + " hours of each other and different text.",
    "The fields rule: price (as a set), rooms and at least one area match. The phone rule: a shared number that is not an agent's.",
    "An agent's number is one found in " + s.agent_number_posts + " or more of these posts (" + s.agent_numbers + " today, " + s.agent_pairs + " pairs): those pairs are not listed one by one; only a sample of at most " + s.agent_sample_size + " (same price, or same rooms and an area) is, marked SAMPLE.",
    "Judge by the texts and photos. The grey chips say which rule found the pair; nothing here marks a post as a duplicate.",
  ];
  lines.forEach(t => box.appendChild(el("p", { text: t })));
}

document.getElementById("export").addEventListener("click", () => {
  const pairs = {};
  let open = 0;
  DATA.pairs.forEach(pair => {
    const s = stateOf(pair);
    if (!s.verdict) { open++; return; }
    pairs[pair.key] = {
      text_sha256: [pair.posts[0].text_sha256, pair.posts[1].text_sha256],
      found_by: pair.found_by,
      verdict: s.verdict,
      note: s.note,
    };
  });
  if (open && !confirm(open + " pairs have no verdict and are not exported. Export the rest?")) return;
  const file = { format_version: DATA.format_version, exported_at: new Date().toISOString(), rules_version: DATA.rules_version, pairs: pairs };
  const blob = new Blob([JSON.stringify(file, null, 1) + "\n"], { type: "application/json" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "pair_verdicts.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
});
["filter-signal", "filter-open"].forEach(id => document.getElementById(id).addEventListener("change", refresh));

renderSummary();
DATA.pairs.forEach((pair, i) => cardsBox.appendChild(renderCard(pair, i)));
if (!DATA.pairs.length) cardsBox.appendChild(el("p", { text: "No candidate pair." }));
refresh();
</script>
</body>
</html>
