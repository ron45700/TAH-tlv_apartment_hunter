# Known places: well-known squares, junctions, markets, malls, hospitals, stations, the port, the
# main beaches and hotels and campuses, each with the areas it lies in (DECISIONS.md #205).
# Rendered into the model's instructions as known places (classify/instructions.py), never typed
# there. Read only through tlv_hunter/areas/reference.py. Ron adds entries by hand; each needs
# every field below.
#
# `name` is the place as people write it; `aliases` are other ways it is written. `lat`/`lon` are
# WGS84. `areas` are municipal numbers (`ms_shchuna`, 1-71): the area the point lies in, and every
# area whose boundary is within `touch_meters` of the point (a place on a boundary lists every area
# it touches). For a new entry: a point query against layer 511 gives the area; the coordinates
# come from a stated free source, with its date.
source:
  coordinates: 'OpenStreetMap contributors, ODbL (https://www.openstreetmap.org/copyright): searched through
    Nominatim (https://nominatim.openstreetmap.org, one request a second, an identifying User-Agent, results
    cached in data/raw/) and, for junctions and stations, the Overpass API (https://overpass-api.de).
    The object of each place is named in its `coordinates_source`.'
  areas: 'Tel Aviv-Yafo Municipality, layer 511 (https://gisn.tel-aviv.gov.il/arcgis/rest/services/IView2/MapServer/511):
    a point query per place, cross-checked against the layer''s polygons fetched once (outSR 4326).'
  polygons_fixture: data/raw/tlv_gis_layer511_polygons_2026-10-06.json
  point_queries_fixture: data/raw/tlv_gis_layer511_point_queries_2026-10-06.json
  read: '2026-10-06'
  touch_meters: 40
