[project]
name = "tlv-hunter"
version = "0.0.0"
description = "Personal monitor for public Tel Aviv apartment Facebook groups."
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi==0.143.0",
    "openai==3.24.0",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.2,<7",
    "starlette==1.7.0",
    "tzdata>=2026.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest>=8.3",
    "ruff>=0.8",
]
# The browser image only (Dockerfile.browser; PHASE_6.md §6.5, DECISIONS.md #531): the version the
# spikes ran, matching the base image's browsers. Never installed by a plain `uv sync`.
browser = [
    "playwright==1.63.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
markers = [
    "raw_fixtures: reads data/raw/ (gitignored); left out by the GitHub Action, run locally",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scratch", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
